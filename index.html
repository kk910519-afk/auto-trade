const KEY = 'autotrade-dash-key';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode(...u));
async function derive(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: bytes(P.salt), iterations: P.it, hash: 'SHA-256'}, base, 256));
}
async function unlock(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(P.iv)}, key, bytes(P.data));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const msg = t => { document.getElementById('msg').textContent = t; };
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go');
  go.disabled = true; msg('');
  try {
    const raw = await derive(document.getElementById('pw').value);
    const html = await unlock(raw);
    if (document.getElementById('keep').checked) { try { localStorage.setItem(KEY, b64(raw)); } catch (err) {} }
    show(html);
  } catch (err) { msg(crypto.subtle ? '비밀번호가 맞지 않습니다.' : '이 브라우저에서는 열 수 없습니다 (https 주소로 열어 주세요).'); go.disabled = false; }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (err) {}
  if (!saved) return;
  try { show(await unlock(bytes(saved))); } catch (err) { try { localStorage.removeItem(KEY); } catch (e2) {} }
})();
